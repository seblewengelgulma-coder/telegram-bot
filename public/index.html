<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>እፉዬ ቴሌግራም ሚኒ አፕ ጨዋታዎች</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; padding: 10px; padding-bottom: 70px; }
        
        /* Header & Profile */
        .header { background: #1e293b; padding: 12px 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .user-info h4 { font-size: 16px; color: #38bdf8; }
        .user-info p { font-size: 12px; color: #94a3b8; }
        .balance-badge { background: #334155; padding: 6px 14px; border-radius: 20px; font-weight: bold; color: #4ade80; border: 1px solid #475569; }

        /* Navigation Tabs */
        .nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 15px; }
        .tab-btn { background: #1e293b; border: none; color: #94a3b8; padding: 10px 5px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.3s; text-align: center; }
        .tab-btn.active { background: #2563eb; color: white; }

        /* Sections */
        .section { display: none; background: #1e293b; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .section.active { display: block; }

        h3 { margin-bottom: 12px; font-size: 16px; color: #f8fafc; border-bottom: 2px solid #334155; padding-bottom: 8px; }

        /* Keno Game Styles */
        .bet-selector { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 8px 12px; border-radius: 8px; }
        .bet-selector select { background: #0f172a; color: white; border: 1px solid #475569; padding: 5px 10px; border-radius: 5px; }
        .grid-80 { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-bottom: 15px; }
        .num-btn { background: #334155; border: none; color: white; padding: 8px 0; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.2s; position: relative; }
        .num-btn.selected { background: #22c55e !important; transform: scale(1.05); }
        .num-btn.drawn { background: #ef4444 !important; }
        .num-btn.matched { background: #eab308 !important; color: #000; }

        /* Bingo Game Styles */
        .bingo-caller-box { background: #0f172a; border: 2px solid #38bdf8; border-radius: 10px; padding: 12px; text-align: center; margin-bottom: 15px; }
        .called-number-display { font-size: 32px; font-weight: bold; color: #38bdf8; margin: 5px 0; }
        
        .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 320px; margin: 15px auto; }
        .bingo-cell { background: #334155; border: 1px solid #475569; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 14px; color: #fff; transition: 0.2s; }
        .bingo-cell.marked { background: #16a34a; color: white; border-color: #22c55e; }
        .bingo-cell.called-hit { border: 2px dashed #facc15; }
        .bingo-header-cell { background: #1e293b; color: #38bdf8; font-weight: bold; border: none; font-size: 15px; }

        /* General Buttons & Forms */
        .btn-main { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn-main:active { transform: scale(0.98); }
        .btn-main:disabled { background: #475569; cursor: not-allowed; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; font-size: 14px; }
        
        .result-box { margin-top: 12px; padding: 10px; border-radius: 6px; background: #0f172a; font-size: 13px; text-align: center; min-height: 40px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="user-info">
            <h4 id="u-name">ተጫዋች</h4>
            <p>ID: <span id="u-id">---</span></p>
        </div>
        <div class="balance-badge">💰 <span id="u-balance">0</span> ETB</div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('keno', this)">🎲 ኬኖ</button>
        <button class="tab-btn" onclick="switchTab('bingo', this)">🎯 ቢንጎ</button>
        <button class="tab-btn" onclick="switchTab('wallet', this)">💳 የገንዘብ ግብይት</button>
        <button class="tab-btn" onclick="switchTab('comment', this)">💬 አስተያየት</button>
    </div>

    <!-- 1. KENO SECTION -->
    <div id="keno-section" class="section active">
        <h3>🎲 የኬኖ ጨዋታ (ከ 1 እስከ 10 ቁጥሮች ይምረጡ)</h3>
        <div class="bet-selector">
            <span>የውርርድ መጠን:</span>
            <select id="keno-bet-amount">
                <option value="10">10 ETB</option>
                <option value="20">20 ETB</option>
                <option value="50">50 ETB</option>
                <option value="100">100 ETB</option>
            </select>
        </div>
        <div class="grid-80" id="keno-grid"></div>
        <button class="btn-main" id="keno-btn" onclick="startKenoDraw()">🎲 ኬኖ ድሮ ጀምር (Draw)</button>
        <div class="result-box" id="keno-result">ቁጥሮችን ይምረጡና ጨዋታ ይጀምሩ</div>
    </div>

    <!-- 2. BINGO SECTION -->
    <div id="bingo-section" class="section">
        <h3>🎯 የቢንጎ የቀጥታ ጥሪ ጨዋታ</h3>
        
        <!-- Live Caller Box -->
        <div class="bingo-caller-box">
            <div style="font-size: 12px; color: #94a3b8;">የሚጠራው ቁጥር:</div>
            <div class="called-number-display" id="current-called-num">--</div>
            <div style="font-size: 11px; color: #38bdf8;" id="caller-status">ጨዋታው ገና አልጀመረም</div>
        </div>

        <div class="bingo-grid" id="bingo-board"></div>
        
        <div style="display: flex; gap: 8px;">
            <button class="btn-main" id="start-bingo-btn" onclick="startBingoGame()" style="background: #16a34a;">🚀 ቢንጎ ጀምር</button>
            <button class="btn-main" id="check-bingo-btn" onclick="checkBingoWin()" disabled>🎯 BINGO አረጋግጥ</button>
        </div>
        <div class="result-box" id="bingo-result">ጨዋታውን ለመጀመር  "ቢንጎ ጀምር" ይጫኑ (ውርርድ: 10 ETB)</div>
    </div>

    <!-- 3. WALLET SECTION -->
    <div id="wallet-section" class="section">
        <h3>💳 የዲፖዚት እና ዊዝድሮ ጥያቄ</h3>
        <div class="form-group">
            <label>የግብይት አይነት ይምረጡ:</label>
            <select class="form-control" id="req-type">
                <option value="deposit">ዲፖዚት (Deposit - ገንዘብ ማስገባት)</option>
                <option value="withdraw">ዊዝድሮ (Withdraw - ገንዘብ ማውጣት)</option>
            </select>
        </div>
        <div class="form-group">
            <label>የብር መጠን (ETB):</label>
            <input type="number" class="form-control" id="req-amount" placeholder="ምሳሌ: 100">
        </div>
        <div class="form-group">
            <label>ስልክ ቁጥር / የባንክ ዝርዝር:</label>
            <input type="text" class="form-control" id="req-details" placeholder="ስልክ ቁጥር ወይም የባንክ አካውንት">
        </div>
        <button class="btn-main" onclick="submitRequest()"> ጥያቄ ላክ </button>
        <div class="result-box" id="wallet-result" style="margin-top:10px;">ጥያቄዎን በአስተማማኝ ሁኔታ ይላኩ</div>
    </div>

    <!-- 4. COMMENT SECTION -->
    <div id="comment-section" class="section">
        <h3>💬 ለአድሚን አስተያየት መስጫ</h3>
        <div class="form-group">
            <label>መልእክትዎ ወይም ጥያቄዎ:</label>
            <textarea class="form-control" id="comment-msg" rows="4" placeholder="አስተያየትዎን እዚህ ይጻፉ..."></textarea>
        </div>
        <button class="btn-main" onclick="sendComment()">አስተያየት ላክ</button>
        <div class="result-box" id="comment-result" style="margin-top:10px;">አስተያየትዎ ለአድሚን በቀጥታ ይተላለፋል</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe?.user?.id || 380035906;
        const userName = tg.initDataUnsafe?.user?.first_name || 'ተጫዋች';
        
        document.getElementById('u-id').innerText = userId;
        document.getElementById('u-name').innerText = userName;

        let userBalance = 0;

        async function fetchUserData() {
            try {
                let res = await fetch(`/api/user/${userId}`);
                let data = await res.json();
                userBalance = data.balance;
                document.getElementById('u-balance').innerText = userBalance;
            } catch(e) {
                console.error("Error fetching user:", e);
            }
        }
        fetchUserData();

        function switchTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId + '-section').classList.add('active');
            btn.classList.add('active');
        }

        // --- KENO LOGIC ---
        let selectedKenoNums = [];
        const kenoGrid = document.getElementById('keno-grid');
        
        function createKenoBoard() {
            kenoGrid.innerHTML = '';
            for(let i = 1; i <= 80; i++) {
                let btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.innerText = i;
                btn.id = `k-btn-${i}`;
                btn.onclick = () => toggleKenoNum(i);
                kenoGrid.appendChild(btn);
            }
        }
        createKenoBoard();

        function toggleKenoNum(num) {
            let idx = selectedKenoNums.indexOf(num);
            let btn = document.getElementById(`k-btn-${num}`);
            if(idx > -1) {
                selectedKenoNums.splice(idx, 1);
                btn.classList.remove('selected');
                btn.innerText = num;
            } else {
                if(selectedKenoNums.length >= 10) {
                    alert('⚠️ ቢበዛ 10 ቁጥሮች ብቻ መምረጥ ይችላሉ!');
                    return;
                }
                selectedKenoNums.push(num);
                btn.classList.add('selected');
            }
        }

        async function startKenoDraw() {
            if(selectedKenoNums.length === 0) {
                alert('⚠️ ቢያንስ አንድ ቁጥር ይምረጡ!');
                return;
            }
            let betAmount = parseInt(document.getElementById('keno-bet-amount').value);
            let kenoBtn = document.getElementById('keno-btn');
            kenoBtn.disabled = true;

            let res = await fetch('/api/play/keno', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId, selectedNumbers: selectedKenoNums, betAmount })
            });
            let data = await res.json();
            
            if(!data.success) {
                alert(data.message);
                kenoBtn.disabled = false;
                return;
            }

            let drawns = data.drawnNumbers;
            let currentIdx = 0;
            document.getElementById('keno-result').innerText = "🎲 ኬኖ ጨዋታ በሂደት ላይ... ቁጥሮች እየወጡ ነው";

            let drawInterval = setInterval(() => {
                if(currentIdx < drawns.length) {
                    let drawnNum = drawns[currentIdx];
                    let btnEl = document.getElementById(`k-btn-${drawnNum}`);
                    if(btnEl) {
                        if(selectedKenoNums.includes(drawnNum)) {
                            btnEl.className = 'num-btn matched';
                            btnEl.innerText = `⭐${drawnNum}`;
                        } else {
                            btnEl.className = 'num-btn drawn';
                        }
                    }
                    currentIdx++;
                } else {
                    clearInterval(drawInterval);
                    kenoBtn.disabled = false;
                    userBalance = data.newBalance;
                    document.getElementById('u-balance').innerText = userBalance;

                    if(data.winAmount > 0) {
                        document.getElementById('keno-result').innerHTML = `<span style="color:#4ade80;">🎉 አሸንፈዋል! ሽልማት: ETB ${data.winAmount}</span>`;
                    } else {
                        document.getElementById('keno-result').innerHTML = `<span style="color:#ef4444;">❌ ተሸንፈዋል! አዲስ ጨዋታ ይጀምሩ።</span>`;
                    }

                    setTimeout(() => {
                        selectedKenoNums = [];
                        createKenoBoard();
                    }, 4000);
                }
            }, 3000);
        }

        // --- BINGO LOGIC (Automatic Board & Live Number Calling) ---
        let bingoCells = []; 
        let calledNumbers = [];
        let bingoInterval = null;

        function generateRandomBingoCard() {
            let boardEl = document.getElementById('bingo-board');
            boardEl.innerHTML = '';
            bingoCells = [];

            // B I N G O Header
            ['B','I','N','G','O'].forEach(char => {
                let div = document.createElement('div');
                div.className = 'bingo-cell bingo-header-cell';
                div.innerText = char;
                boardEl.appendChild(div);
            });

            // ከ 1 እስከ 75 ካሉ ቁጥሮች በዘፈቀደ 24 ቁጥሮችን መምረጥ
            let randNums = [];
            while(randNums.length < 24) {
                let r = Math.floor(Math.random() * 75) + 1;
                if(!randNums.includes(r)) randNums.push(r);
            }

            let nIdx = 0;
            for(let r = 0; r < 5; r++) {
                let row = [];
                for(let c = 0; c < 5; c++) {
                    let cellDiv = document.createElement('div');
                    cellDiv.className = 'bingo-cell';
                    
                    if(r === 2 && c === 2) {
                        // መሃከለኛው ነፃ ⭐ ሴል
                        cellDiv.innerText = '⭐';
                        cellDiv.classList.add('marked');
                        row.push({ number: 'FREE', marked: true, isFree: true, element: cellDiv });
                    } else {
                        let num = randNums[nIdx++];
                        cellDiv.innerText = num;
                        let cellData = { number: num, marked: false, isFree: false, element: cellDiv };
                        
                        cellDiv.onclick = () => {
                            // ተጫዋቹ ማርክ ማድረግ የሚችለው የተጠራ ቁጥር ከሆነ ብቻ ነው
                            if(calledNumbers.includes(num)) {
                                cellData.marked = !cellData.marked;
                                cellDiv.classList.toggle('marked');
                            } else {
                                alert(`⚠️ ቁጥር ${num} ገና አልተጠራም!`);
                            }
                        };
                        row.push(cellData);
                    }
                    boardEl.appendChild(cellDiv);
                }
                bingoCells.push(row);
            }
        }
        generateRandomBingoCard();

        async function startBingoGame() {
            if(userBalance < 10) {
                alert('⚠️ በቂ የኪስ ቦርሳ ሂሳብ የለዎትም (ቢያንስ 10 ETB ያስፈልጋል)');
                return;
            }

            // የውርርድ ክፍያ በሰርቨር በኩል መቀነስ
            let res = await fetch('/api/play/bingo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId, betAmount: 10 })
            });
            let data = await res.json();
            if(!data.success) { alert(data.message); return; }

            userBalance = data.newBalance;
            document.getElementById('u-balance').innerText = userBalance;

            document.getElementById('start-bingo-btn').disabled = true;
            document.getElementById('check-bingo-btn').disabled = false;
            document.getElementById('caller-status').innerText = "ቁጥሮች በመጥራት ላይ ናቸው...";
            
            generateRandomBingoCard();
            calledNumbers = [];

            // 1 እስከ 75 ያሉትን ቁጥሮች በቅደም ተከተል እንዳይሆን በዘፈቀደ ማቀላቀል
            let allPool = [];
            for(let i=1; i<=75; i++) allPool.push(i);
            allPool.sort(() => Math.random() - 0.5);

            let callIndex = 0;
            bingoInterval = setInterval(() => {
                if(callIndex < allPool.length) {
                    let currentNum = allPool[callIndex];
                    calledNumbers.push(currentNum);
                    document.getElementById('current-called-num').innerText = currentNum;
                    
                    // በካርዱ ላይ ካሉ አብርቶ ማሳየት
                    for(let r=0; r<5; r++) {
                        for(let c=0; c<5; c++) {
                            if(bingoCells[r][c].number === currentNum) {
                                bingoCells[r][c].element.classList.add('called-hit');
                            }
                        }
                    }
                    callIndex++;
                } else {
                    clearInterval(bingoInterval);
                    document.getElementById('caller-status').innerText = "ጨዋታው ተጠናቀቀ!";
                }
            }, 3000); // በየ 3 ሰከንድ አንድ ቁጥር ይጠራል
        }

        // የቢንጎ አሸናፊነት አልጎሪዝም ማረጋገጫ (Rows, Columns, Diagonals)
        async function checkBingoWin() {
            let hasWon = false;

            // 1. ረድፎችን ማረጋገጥ
            for(let r = 0; r < 5; r++) {
                if(bingoCells[r].every(cell => cell.marked)) { hasWon = true; break; }
            }

            // 2. ኮሎሞችን ማረጋገጥ
            for(let c = 0; c < 5; c++) {
                if(bingoCells.every(row => row[c].marked)) { hasWon = true; break; }
            }

            // 3. ዲያጎናሎችን ማረጋገጥ
            if(bingoCells[0][0].marked && bingoCells[1][1].marked && bingoCells[2][2].marked && bingoCells[3][3].marked && bingoCells[4][4].marked) {
                hasWon = true;
            }
            if(bingoCells[0][4].marked && bingoCells[1][3].marked && bingoCells[2][2].marked && bingoCells[3][1].marked && bingoCells[4][0].marked) {
                hasWon = true;
            }

            if(!hasWon) {
                document.getElementById('bingo-result').innerHTML = `<span style="color:#ef4444;">❌ ገና አልሞሉም! ረድፍ ወይም ዲያጎናል አልተሟላም አሁንም ይጫወቱ።</span>`;
                return;
            }

            // አሸናፊ ከሆኑ ጨዋታውን አቁመን ሽልማት እንሰጣለን
            clearInterval(bingoInterval);
            let winAmount = 50; // የቢንጎ ሽልማት መጠን

            userBalance += winAmount;
            document.getElementById('u-balance').innerText = userBalance;
            document.getElementById('bingo-result').innerHTML = `<span style="color:#4ade80;">🎉 BINGO! አሸንፈዋል! ሽልማት: ${winAmount} ETB</span>`;
            
            document.getElementById('start-bingo-btn').disabled = false;
            document.getElementById('check-bingo-btn').disabled = true;
            document.getElementById('caller-status').innerText = "እንኳን ደስ አሎት! አሸናፊ ሆነዋል";
        }

        // --- WALLET & COMMENT APIs ---
        async function submitRequest() {
            let type = document.getElementById('req-type').value;
            let amount = parseFloat(document.getElementById('req-amount').value);
            let details = document.getElementById('req-details').value;

            if(!amount || !details) {
                alert('⚠️ እባክዎ የብር መጠን እና የባንክ/ስልክ ዝርዝር በትክክል ይሙሉ!');
                return;
            }

            try {
                let res = await fetch('/api/request', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId, userName, type, amount, details })
                });
                let data = await res.json();
                if(data.success) {
                    document.getElementById('wallet-result').innerHTML = `<span style="color:#4ade80;">✅ ጥያቄዎ ለአድሚን ተልኳል!</span>`;
                    document.getElementById('req-amount').value = '';
                    document.getElementById('req-details').value = '';
                } else {
                    alert(data.message || 'ስህተት ተፈጥሯል');
                }
            } catch(e) {
                console.error(e);
                alert('ሰርቨር ጋር መገናኘት አልተቻለም');
            }
        }

        async function sendComment() {
            let message = document.getElementById('comment-msg').value;
            if(!message) {
                alert('⚠️ እባክዎ አስተያየትዎን ይጻፉ!');
                return;
            }

            try {
                let res = await fetch('/api/comment', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId, userName, message })
                });
                let data = await res.json();
                if(data.success) {
                    document.getElementById('comment-result').innerHTML = `<span style="color:#4ade80;">✅ አስተያየትዎ ለአድሚን ተልኳል!</span>`;
                    document.getElementById('comment-msg').value = '';
                } else {
                    alert(data.message || 'ስህተት ተፈጥሯል');
                }
            } catch(e) {
                console.error(e);
                alert('ሰርቨር ጋር መገናኘት አልተቻለም');
            }
        }
    </script>
</body>
