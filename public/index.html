<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>እፉዬ ቴሌግራም ሚኒ አፕ</title>
    <!-- የቴሌግራም ዌብ አፕ ስክሪፕት -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1f1f1f);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #2ea6ff);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        /* የፕሮፋይል ካርድ */
        .profile-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }

        .balance-display {
            font-size: 24px;
            font-weight: bold;
            color: #4cd137;
            margin-top: 5px;
        }

        /* የኬኖ ጨዋታ ክፍል */
        .game-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        h2, h3 {
            margin: 5px 0 15px 0;
            text-align: center;
            font-size: 18px;
        }

        .bet-selectors {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .bet-btn {
            background: transparent;
            border: 1px solid var(--button-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .bet-btn.active {
            background: var(--button-color);
            color: var(--button-text-color);
        }

        /* 80 የኬኖ ቁጥሮች ግሪድ */
        .keno-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            margin-bottom: 15px;
        }

        .keno-cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 4px;
            color: var(--text-color);
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .keno-cell.selected {
            background: #e84118;
            color: #fff;
        }

        .keno-cell.drawn {
            background: #4cd137;
            color: #fff;
        }

        /* ዋና መጫወቻ አዝራር */
        .action-btn {
            width: 100%;
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 👤 የተጫዋች መረጃ እና ባላንስ -->
        <div class="profile-card">
            <h3 id="username">ሰላም, ተጫዋች</h3>
            <div>አካውንት ባላንስ</div>
            <div class="balance-display" id="balance">0 ETB</div>
        </div>

        <!-- 🎲 የኬኖ ጨዋታ ማዕከል -->
        <div class="game-section">
            <h2>🎲 የኬኖ ጨዋታ (Keno)</h2>
            
            <!-- የውርርድ መጠን ምርጫ -->
            <div class="bet-selectors">
                <button class="bet-btn active" onclick="setBet(10)">10 ETB</button>
                <button class="bet-btn" onclick="setBet(20)">20 ETB</button>
                <button class="bet-btn" onclick="setBet(50)">50 ETB</button>
                <button class="bet-btn" onclick="setBet(100)">100 ETB</button>
            </div>

            <!-- ቁጥሮች የሚመረጡበት ግሪድ (1 እስከ 80) -->
            <div class="keno-grid" id="kenoGrid"></div>

            <button class="action-btn" onclick="playKeno()">ኬኖ Draw ጀምር 🚀</button>
            
            <div class="result-box" id="resultText"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ከቴሌግራም የሚገኘው የ ተጠቃሚ መለያ (Id) - ካልተገኘ በፈተና ጊዜ ላልተወሰነ ID ይቀየራል
        const userId = tg.initDataUnsafe?.user?.id || 380035906; 
        let currentBet = 10;
        let selectedNumbers = [];
        let userBalance = 0;

        // 1. የተጠቃሚውን መረጃ ከሰቨር ማምጣት
        async function fetchUserData() {
            try {
                let response = await fetch(`/api/user/${userId}`);
                let data = await response.json();
                userBalance = data.balance;
                document.getElementById('balance').innerText = `${userBalance} ETB`;
                if(data.userName) {
                    document.getElementById('username').innerText = `ሰላም, ${data.userName}`;
                }
            } catch (e) {
                console.error('Error fetching user data:', e);
            }
        }

        // 2. የኬኖ ግሪድ ቁጥሮችን መፍጠር (1-80)
        function initKenoGrid() {
            const grid = document.getElementById('kenoGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 80; i++) {
                const cell = document.createElement('button');
                cell.className = 'keno-cell';
                cell.innerText = i;
                cell.id = `cell-${i}`;
                cell.onclick = () => toggleNumber(i);
                grid.appendChild(cell);
            }
        }

        // 3. የውርርድ መጠን መቀየሪያ
        function setBet(amount) {
            currentBet = amount;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.includes(amount)) {
                    btn.classList.add('back', 'active'); // simplified style check
                }
            });
        }

        // 4. ቁጥር መምረጥ ወይም ማጥፋት (ቢበዛ 10)
        function toggleNumber(num) {
            const index = selectedNumbers.indexOf(num);
            if (index > -1) {
                selectedNumbers.splice(index, 1);
                document.getElementById(`cell-${num}`).classList.remove('selected');
            } else {
                if (selectedNumbers.length >= 10) {
                    alert('⚠️ ቢበዛ 10 ቁጥሮች ብቻ መምረጥ ይችላሉ!');
                    return;
                }
                selectedNumbers.push(num);
                document.getElementById(`cell-${num}`).classList.add('selected');
            }
        }

        // 5. የኬኖ ጨዋታ ጥያቄ ወደ ሰቨር መላክ (Play API)
        async function playKeno() {
            if (selectedNumbers.length === 0) {
                alert('❌ ቢያንስ አንድ ቁጥር መምረጥ አለብዎት!');
                return;
            }

            if (userBalance < currentBet && userId !== 380035906) {
                alert('❌ በቂ ባላንስ የለዎትም!');
                return;
            }

            document.getElementById('resultText').innerText = '🎲 ጨዋታው በሂደት ላይ ነው...';

            try {
                let response = await fetch('/api/play/keno', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: userId,
                        selectedNumbers: selectedNumbers,
                        betAmount: currentBet
                    })
                });

                let result = await response.json();
                if (result.success) {
                    // የወጡትን ቁጥሮች በግሪዱ ላይ ማሳየት
                    document.querySelectorAll('.keno-cell').forEach(c => c.classList.remove('drawn'));
                    result.drawnNumbers.forEach(n => {
                        let el = document.getElementById(`cell-${n}`);
                        if(el) el.classList.add('drawn');
                    });

                    userBalance = result.newBalance;
                    document.getElementById('balance').innerText = `${userBalance} ETB`;

                    if (result.winAmount > 0) {
                        document.getElementById('resultText').innerHTML = `🎉 አሸንፈዋል! ሽልማት: ${result.winAmount} ETB`;
                    } else {
                        document.getElementById('resultText').innerText = `❌ ተሸንፈዋል! እንደገና ይሞክሩ።`;
                    }
                } else {
                    alert(result.message);
                    document.getElementById('resultText').innerText = '';
                }
            } catch (e) {
                console.error('Play error:', e);
                document.getElementById('resultText').innerText = '❌ ስህተት ተፈጥሯል!';
            }
        }

        // ገጹ ሲከፈት የሚከናወኑ
        fetchUserData();
        initKenoGrid();
    </script>
</body>
</html>
