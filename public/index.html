<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>እፉዬ ሚኒ አፕ ጨዋታዎች</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 15px; margin: 0; }
        .header { background: #1e293b; padding: 12px; border-radius: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #6366f1; color: white; border: none; padding: 10px 20px; font-size: 15px; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn-green { background: #22c55e; color: #000; font-weight: bold; }
        .btn-red { background: #ef4444; }
        .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 340px; margin: 15px auto; }
        .cell { background: #334155; border: none; padding: 14px 0; font-size: 16px; font-weight: bold; color: #fff; border-radius: 6px; cursor: pointer; }
        .cell.marked { background: #22c55e; color: #000; }
        .section { background: #1e293b; padding: 15px; border-radius: 10px; margin-top: 15px; display: none; }
        input { padding: 10px; width: 80%; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <div>🎮 <b>እፉዬ ማዕከል</b></div>
        <div>ባላንስ: <span id="balance">0</span> ETB</div>
    </div>

    <!-- ዋና መምረጫ ሜኑ -->
    <div id="main-menu">
        <button class="btn" onclick="startBingo(10)">🎯 ቢንጎ ጀምር (10 ETB)</button>
        <button class="btn btn-green" onclick="showSection('deposit-section')">💰 ዲፖዚት (Deposit)</button>
        <button class="btn btn-red" onclick="showSection('withdraw-section')">💳 ዊዝድሮ (Withdraw)</button>
    </div>

    <!-- የቢንጎ ሰሌዳ ማሳያ -->
    <div id="bingo-container" style="display:none;">
        <h3>🎯 የቢንጎ ሰሌዳዎ</h3>
        <div class="board" id="bingo-board"></div>
        <button class="btn" onclick="backToMenu()">🔙 ወደ ዋናው ሜኑ</button>
    </div>

    <!-- ዲፖዚት ክፍል -->
    <div id="deposit-section" class="section">
        <h3>💰 የዲፖዚት ጥያቄ</h3>
        <p>ንግድ ባንክ: 10005741880 | ቴሌብር: 0929441620</p>
        <input type="number" id="dep-amount" placeholder="የብር መጠን ያስገቡ">
        <br>
        <button class="btn btn-green" onclick="requestDeposit()">ዲፖዚት ላክ</button>
        <button class="btn" onclick="backToMenu()">ሰርዝ</button>
    </div>

    <!-- ዊዝድሮ ክፍል -->
    <div id="withdraw-section" class="section">
        <h3>💳 የዊዝድሮ ጥያቄ</h3>
        <input type="number" id="wd-amount" placeholder="ማውጣት የሚፈልጉት መጠን">
        <br>
        <button class="btn btn-red" onclick="requestWithdraw()">ዊዝድሮ ጠይቅ</button>
        <button class="btn" onclick="backToMenu()">ሰርዝ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ከቴሌግራም የሚመጣውን ትክክለኛ የተጠቃሚ  আইডি (User ID) መቀበል
        const userId = tg.initDataUnsafe?.user?.id || 380035906;

        async function fetchUserData() {
            let res = await fetch(`/api/user/${userId}`);
            let data = await res.json();
            if(data.success) {
                document.getElementById('balance').innerText = data.user.balance;
            }
        }
        fetchUserData();

        function showSection(id) {
            document.getElementById('main-menu').style.display = 'none';
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        function backToMenu() {
            document.getElementById('main-menu').style.display = 'block';
            document.getElementById('bingo-container').style.display = 'none';
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            fetchUserData();
        }

        async function startBingo(cost) {
            let res = await fetch('/api/bingo/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, cost })
            });
            let data = await res.json();
            if(data.success) {
                document.getElementById('balance').innerText = data.balance;
                document.getElementById('main-menu').style.display = 'none';
                document.getElementById('bingo-container').style.display = 'block';
                renderBoard(data.matrix);
            } else {
                alert(data.message);
            }
        }

        function renderBoard(matrix) {
            let boardDiv = document.getElementById('bingo-board');
            boardDiv.innerHTML = '';
            matrix.forEach((row, r) => {
                row.forEach((cell, c) => {
                    let btn = document.createElement('button');
                    btn.className = `cell ${cell.marked ? 'marked' : ''}`;
                    btn.innerText = cell.number;
                    btn.onclick = () => {
                        if(!cell.isFree) {
                            cell.marked = !cell.marked;
                            btn.classList.toggle('marked');
                        }
                    };
                    boardDiv.appendChild(btn);
                });
            });
        }

        async function requestDeposit() {
            let amount = document.getElementById('dep-amount').value;
            if(!amount) return alert('እባክዎ የብር መጠን ያስገቡ');
            let res = await fetch('/api/deposit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, amount })
            });
            let data = await res.json();
            alert(data.message);
            backToMenu();
        }

        async function requestWithdraw() {
            let amount = document.getElementById('wd-amount').value;
            if(!amount) return alert('እባክዎ የብር መጠን ያስገቡ');
            let res = await fetch('/api/withdraw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, amount })
            });
            let data = await res.json();
            alert(data.message);
            if(data.success) {
                document.getElementById('balance').innerText = data.balance;
            }
            backToMenu();
        }
    </script>
</body>
</html>
