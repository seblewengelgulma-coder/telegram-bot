<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>እፉዬ ጨዋታዎች ማዕከል - Mini App</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --card-bg: #1e293b;
            --primary: var(--tg-theme-button-color, #6366f1);
            --primary-text: var(--tg-theme-button-text-color, #ffffff);
            --accent: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }
        .header {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .balance-box {
            font-size: 1.1em;
            font-weight: bold;
            color: var(--accent);
        }
        .nav-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            background: var(--card-bg);
            padding: 5px;
            border-radius: 10px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-color);
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: var(--primary-text);
        }
        .section {
            display: none;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .section.active {
            display: block;
        }
        .btn {
            background: var(--primary);
            color: var(--primary-text);
            border: none;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-danger { background: var(--danger); }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        /* ኬኖ ግሪድ */
        .keno-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            margin: 10px 0;
        }
        .keno-cell {
            aspect-ratio: 1;
            background: #334155;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
        }
        .keno-cell.selected {
            background: var(--accent);
        }
        /* ቢንጎ ካርድ */
        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin: 10px 0;
        }
        .bingo-cell {
            aspect-ratio: 1;
            background: #334155;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 0.8em;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .bingo-cell.marked {
            background: var(--accent);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 👤 ዩዘር ሄደር እና ባላንስ -->
    <div class="header">
        <div>
            <div id="userName" style="font-weight: bold;">ተጫዋች</div>
            <div style="font-size: 0.8em; opacity: 0.8;">ደረጃ: <span id="userLevel">1</span></div>
        </div>
        <div class="balance-box">ETB <span id="userBalance">0.00</span></div>
    </div>

    <!-- 🗂 ናቪጌሽን ታቦች -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('keno')">🎲 ኬኖ</button>
        <button class="tab-btn" onclick="switchTab('bingo')">🎯 ቢንጎ</button>
        <button class="tab-btn" onclick="switchTab('wallet')">💰 የገንዘብ ሐዋላ</button>
    </div>

    <!-- 🎲 ኬኖ ሴክሽን -->
    <div id="keno" class="section active">
        <h3>የኬኖ ጨዋታ</h3>
        <label>የውርርድ መጠን (ETB):</label>
        <select id="kenoBetAmount">
            <option value="2">2 ብር</option>
            <option value="5">5 ብር</option>
            <option value="10" selected>10 ብር</option>
            <option value="20">20 ብር</option>
            <option value="50">50 ብር</option>
            <option value="100">100 ብር</option>
        </select>
        <p style="font-size: 0.9em;">እባክዎ ከ 1 እስከ 10 ቁጥሮች ይምረጡ (<span id="selectedCount">0</span>/10)</p>
        <div class="keno-grid" id="kenoGrid"></div>
        <button class="btn" onclick="playKeno()">🚀 ኬኖ ጨዋታ ጀምር</button>
        <div id="kenoResult" style="margin-top: 10px; font-weight: bold;"></div>
    </div>

    <!-- 🎯 ቢንጎ ሴክሽን -->
    <div id="bingo" class="section">
        <h3>የቢንጎ ጨዋታ</h3>
        <label>የውርርድ መጠን:</label>
        <select id="bingoCost">
            <option value="10">10 ETB</option>
            <option value="20">20 ETB</option>
            <option value="50">50 ETB</option>
            <option value="100">100 ETB</option>
        </select>
        <label>ቁጥር ይምረጡ (1-75):</label>
        <input type="number" id="bingoPickNum" min="1" max="75" placeholder="ከ 1 እስከ 75 ቁጥር አስገባ">
        <button class="btn" onclick="pickBingoNumber()">ቁጥር መርጠህ ግባ</button>
        <div id="bingoStatus" style="margin-top: 10px;"></div>
    </div>

    <!-- 💰 ዲፖዚት እና ዊዝድሮ ሴክሽን -->
    <div id="wallet" class="section">
        <h3>ዲፖዚት እና ዊዝድሮ</h3>
        <div style="margin-bottom: 15px;">
            <h4>ገንዘብ ማስገባት (Deposit)</h4>
            <input type="number" id="depositAmount" placeholder="የብር መጠን">
            <button class="btn" onclick="requestDeposit()">ዲፖዚት ጥያቄ ላክ</button>
        </div>
        <hr style="border-color: #334155;">
        <div>
            <h4>ገንዘብ ማውጣት (Withdraw)</h4>
            <input type="number" id="withdrawAmount" placeholder="የብር መጠን">
            <input type="text" id="withdrawPhone" placeholder="ስልክ ቁጥር (ተቀባይ)">
            <button class="btn btn-danger" onclick="requestWithdraw()">ዊዝድሮ ጥያቄ ላክ</button>
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // ቴሌግራም ዩዘር መረጃ ማግኘት
    const initDataRaw = tg.initData || "";
    let userId = tg.initDataUnsafe?.user?.id || 380035906; // ለቴስት የሚሆን ነባሪ ID

    // 👤 የተጠቃሚ ፕሮፋይል  ዳታ መጫን
    async function loadUserProfile() {
        try {
            const res = await fetch(`/api/user/profile?userId=${userId}`, {
                headers: { 'X-Telegram-Init-Data': initDataRaw }
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('userName').innerText = data.user.userName;
                document.getElementById('userBalance').innerText = data.user.balance.toFixed(2);
                document.getElementById('userLevel').innerText = data.user.level;
            }
        } catch (err) {
            console.error('Profile load error:', err);
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // 🎲 የኬኖ ግሪድ መገንባት (1 እስከ 80)
    const kenoGrid = document.getElementById('kenoGrid');
    let selectedKenoNumbers = [];

    for (let i = 1; i <= 80; i++) {
        const btn = document.createElement('button');
        btn.className = 'keno-cell';
        btn.innerText = i;
        btn.onclick = () => {
            const idx = selectedKenoNumbers.indexOf(i);
            if (idx > -1) {
                selectedKenoNumbers.splice(idx, 1);
                btn.classList.remove('selected');
            } else {
                if (selectedKenoNumbers.length >= 10) {
                    alert('ቢበዛ 10 ቁጥሮች ብቻ መምረጥ ይችላሉ!');
                    return;
                }
                selectedKenoNumbers.push(i);
                btn.classList.add('selected');
            }
            document.getElementById('selectedCount').innerText = selectedKenoNumbers.length;
        };
        kenoGrid.appendChild(btn);
    }

    // 🚀 የኬኖ ፕሌይ ሎጂክ
    async function playKeno() {
        const betAmount = Number(document.getElementById('kenoBetAmount').value);
        if (selectedKenoNumbers.length === 0) {
            alert('እባክዎ ቢያንስ አንድ ቁጥር ይምረጡ!');
            return;
        }

        try {
            const res = await fetch('/api/keno/play', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, betAmount, selectedNumbers: selectedKenoNumbers })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('kenoResult').innerHTML = `
                    ✅ ጨዋታ ተጠናቀቀ!<br>
                    የወጡ ቁጥሮች: ${data.drawnNumbers.join(', ')}<br>
                    የገጠሙት: ${data.matchesCount} ቁጥር<br>
                    ሽልማት: ETB ${data.winAmount}
                `;
                document.getElementById('userBalance').innerText = data.newBalance.toFixed(2);
            } else {
                alert(data.message);
            }
        } catch (err) {
            alert('ሰርቨር ስህተት ተፈጥሯል');
        }
    }

    // 🎯 ቢንጎ ቁጥር መምረጥ
    async function pickBingoNumber() {
        const cost = Number(document.getElementById('bingoCost').value);
        const number = Number(document.getElementById('bingoPickNum').value);
        if (!number || number < 1 || number > 75) {
            alert('እባክዎ ከ 1 እስከ 75 የሆነ ትክክለኛ ቁጥር ያስገቡ!');
            return;
        }

        try {
            const res = await fetch('/api/bingo/pick', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, cost, number })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('bingoStatus').innerHTML = `✅ ጨዋታ ተጀምሯል! Game ID: ${data.gameId}`;
                document.getElementById('userBalance').innerText = data.newBalance.toFixed(2);
            } else {
                alert(data.message);
            }
        } catch (err) {
            alert('ስህተት ተፈጥሯል');
        }
    }

    // 💰 ዲፖዚት ጥያቄ
    async function requestDeposit() {
        const amount = Number(document.getElementById('depositAmount').value);
        if (!amount || amount <= 0) { alert('እባክዎ ትክክለኛ መጠን ያስገቡ'); return; }

        const res = await fetch('/api/deposit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, amount })
        });
        const data = await res.json();
        alert(data.message);
    }

    // 💳 ዊዝድሮ ጥያቄ
    async function requestWithdraw() {
        const amount = Number(document.getElementById('withdrawAmount').value);
        const phone = document.getElementById('withdrawPhone').value;
        if (!amount || !phone) { alert('እባክዎ መረጃውን በትክክል ይሙሉ'); return; }

        const res = await fetch('/api/withdraw', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, amount, phone })
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('userBalance').innerText = data.balance.toFixed(2);
        }
        alert(data.message);
    }

    // የመጀመሪያ ሎድ
    loadUserProfile();
</script>

</body>
</html>
