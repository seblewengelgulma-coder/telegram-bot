<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>እፉዬ ጨዋታዎች - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; color: #38bdf8; }
        .balance-card {
            background: #334155;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .menu-btns, .game-area { display: flex; flex-direction: column; gap: 10px; }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #0369a1; }
        .secondary-btn { background: #475569; }
        .secondary-btn:hover { background: #334155; }
        .grid-80 {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            margin: 10px 0;
        }
        .grid-80 button {
            padding: 8px 2px;
            font-size: 12px;
            background: #334155;
        }
        .grid-80 button.selected {
            background: #22c55e;
        }
        .hidden { display: none !important; }
        .result-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎮 እፉዬ ጨዋታዎች ማዕከል</h2>
    <div class="balance-card">
        👤 <span id="userName">ተጫዋች</span> | 💰 ባላንስ: <span id="userBalance">0</span> ETB
    </div>

    <!-- ዋናው ምረጫ -->
    <div id="mainMenuView" class="menu-btns">
        <button onclick="switchView('bingoView')">🎯 ቢንጎ ሚኒ አፕ ጨዋታ</button>
        <button onclick="switchView('kenoView')">🎲 ኬኖ ሚኒ አፕ ጨዋታ</button>
        <button class="secondary-btn" onclick="closeMiniApp()">🔙 ወደ ቦት ተመለስ</button>
    </div>

    <!-- የቢንጎ ማዕከል -->
    <div id="bingoView" class="hidden game-area">
        <h3>🎯 ቢንጎ ጨዋታ</h3>
        <p>የውርርድ መጠን ይምረጡ:</p>
        <div style="display: flex; gap: 5px;">
            <button onclick="setBingoCost(10)">10 ETB</button>
            <button onclick="setBingoCost(20)">20 ETB</button>
            <button onclick="setBingoCost(50)">50 ETB</button>
        </div>
        <div id="bingoActionArea" class="hidden">
            <p>መጫወት የሚፈልጉትን ቁጥር (1-75) ይምረጡ:</p>
            <input type="number" id="bingoNumInput" min="1" max="75" placeholder="ቁጥር 1 እስከ 75" style="padding:10px; border-radius:5px; border:none; width:90%;">
            <button onclick="playBingoMiniApp()" style="margin-top: 10px; background: #22c55e;">ቁጥሩን መርጠህ ጀምር</button>
        </div>
        <div id="bingoStatus" class="result-box hidden"></div>
        <button class="secondary-btn" onclick="switchView('mainMenuView')" style="margin-top:10px;">🔙 ተመለስ</button>
    </div>

    <!-- የኬኖ ማዕከል -->
    <div id="kenoView" class="hidden game-area">
        <h3>🎲 ኬኖ ጨዋታ</h3>
        <p>የውርርድ መጠን: <span id="kenoBetDisplay">10</span> ETB</p>
        <div style="display: flex; gap: 5px; flex-wrap: wrap;">
            <button onclick="setKenoBet(5)">5 ETB</button>
            <button onclick="setKenoBet(10)">10 ETB</button>
            <button onclick="setKenoBet(20)">20 ETB</button>
        </div>
        <p>ከ 1 እስከ 10 ቁጥሮች ይምረጡ (አሁን የመረጧቸው: <span id="kenoSelectedCount">0</span>/10)</p>
        <div class="grid-80" id="kenoGrid"></div>
        <button onclick="playKenoMiniApp()" style="background: #22c55e; margin-top:10px;">🎲 ኬኖ ድራው ጀምር</button>
        <div id="kenoResult" class="result-box hidden"></div>
        <button class="secondary-btn" onclick="switchView('mainMenuView')" style="margin-top:10px;">🔙 ተመለስ</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let user = { userId: 380035906, balance: 100, userName: 'ተጫዋች' };
    let selectedBingoCost = 10;
    let kenoBet = 10;
    let selectedKenoNumbers = [];

    // ቴሌግራም ዩዘር ዳታ ማምጣት
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        user.userId = tg.initDataUnsafe.user.id;
        user.userName = tg.initDataUnsafe.user.first_name;
        fetchUserData();
    } else {
        fetchUserData();
    }

    function fetchUserData() {
        fetch(`/api/user/profile?userId=${user.userId}`)
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    user.balance = data.user.balance;
                    user.userName = data.user.userName;
                    document.getElementById('userName').innerText = user.userName;
                    document.getElementById('userBalance').innerText = user.balance;
                }
            }).catch(e => console.log(e));
    }

    function switchView(viewId) {
        document.getElementById('mainMenuView').classList.add('hidden');
        document.getElementById('bingoView').classList.add('hidden');
        document.getElementById('kenoView').classList.add('hidden');
        document.getElementById(viewId).classList.remove('hidden');
    }

    function closeMiniApp() {
        tg.close(); // ጨዋታው ሲያልቅ ወይም ሲወጡ በቀጥታ ወደ ቦቱ ይመልሳል
    }

    // 🎯 የቢንጎ ሎጂክ
    function setBingoCost(cost) {
        selectedBingoCost = cost;
        document.getElementById('bingoActionArea').classList.remove('hidden');
    }

    function playBingoMiniApp() {
        let num = parseInt(document.getElementById('bingoNumInput').value);
        if(!num || num < 1 || num > 75) {
            alert('እባክዎ ትክክለኛ ከ 1 እስከ 75 ቁጥር ያስገቡ!');
            return;
        }

        fetch('/api/bingo/pick', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: user.userId, cost: selectedBingoCost, number: num })
        })
        .then(res => res.json())
        .then(data => {
            let statusDiv = document.getElementById('bingoStatus');
            statusDiv.classList.remove('hidden');
            if(data.success) {
                document.getElementById('userBalance').innerText = data.newBalance;
                statusDiv.innerHTML = `✅ ቁጥሩ ተይዟል! ጨዋታው በቦቱ በሂደት ላይ ነው። <br><button onclick="closeMiniApp()" style="margin-top:10px; background:#e11d48;">ወደ ቦት ተመለስ</button>`;
            } else {
                statusDiv.innerHTML = `❌ ${data.message}`;
            }
        });
    }

    // 🎲 የኬኖ ሎጂክ
    function initKenoGrid() {
        let grid = document.getElementById('kenoGrid');
        grid.innerHTML = '';
        for(let i=1; i<=80; i++) {
            let btn = document.createElement('button');
            btn.innerText = i;
            btn.id = `keno_btn_${i}`;
            btn.onclick = () => toggleKenoNumber(i);
            grid.appendChild(btn);
        }
    }
    initKenoGrid();

    function setKenoBet(amount) {
        kenoBet = amount;
        document.getElementById('kenoBetDisplay').innerText = amount;
    }

    function toggleKenoNumber(num) {
        let idx = selectedKenoNumbers.indexOf(num);
        let btn = document.getElementById(`keno_btn_${num}`);
        if(idx > -1) {
            selectedKenoNumbers.splice(idx, 1);
            btn.classList.remove('selected');
        } else {
            if(selectedKenoNumbers.length >= 10) {
                alert('ቢበዛ 10 ቁጥሮች ብቻ መምረጥ ይችላሉ!');
                return;
            }
            selectedKenoNumbers.push(num);
            btn.classList.add('selected');
        }
        document.getElementById('kenoSelectedCount').innerText = selectedKenoNumbers.length;
    }

    function playKenoMiniApp() {
        if(selectedKenoNumbers.length === 0) {
            alert('እባክዎ ቢያንስ 1 ቁጥር ይምረጡ!');
            return;
        }

        fetch('/api/keno/play', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: user.userId, betAmount: kenoBet, selectedNumbers: selectedKenoNumbers })
        })
        .then(res => res.json())
        .then(data => {
            let resDiv = document.getElementById('kenoResult');
            resDiv.classList.remove('hidden');
            if(data.success) {
                document.getElementById('userBalance').innerText = data.newBalance;
                resDiv.innerHTML = `🎉 <b>ጨዋታው አልቋል!</b><br>
                    የወጡ ቁጥሮች: ${data.drawnNumbers.slice(0, 10).join(', ')}...<br>
                    ግጥሚያዎች: ${data.matchesCount} | ሽልማት: <b>${data.winAmount} ETB</b><br>
                    <button onclick="closeMiniApp()" style="margin-top:10px; background:#22c55e;">ጨዋታው አልቋል - ወደ ቦት ተመለስ</button>`;
            } else {
                resDiv.innerHTML = `❌ ${data.message}`;
            }
        });
    }
</script>

</body>
</html>
